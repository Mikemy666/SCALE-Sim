[general]
run_name = dynamic_24_W1

[architecture_presets]
arrayheight = 64
arraywidth = 64
ifmapsramszkb = 32
filtersramszkb = 32
ofmapsramszkb = 32
ifmapoffset = 0
filteroffset = 10000000
ofmapoffset = 20000000
bandwidth = 1024
dataflow = ws
readrequestbuffer = 128
writerequestbuffer = 128

[layout]
ifmapcustomlayout = True
ifmapsrambankbandwidth = 128
ifmapsrambanknum = 8
ifmapsrambankport = 1
filtercustomlayout = True
filtersrambankbandwidth = 128
filtersrambanknum = 8
filtersrambankport = 1
ofmapsrambanknum = 8
ofmapsrambankbandwidth = 128
ofmapsrambankport = 1

[sparsity]
sparsitysupport = 1
sparserep = ellpack_block
optimizedmapping = false
blocksize = 8
randomnumbergeneratorseed = 40

[run_presets]
interfacebandwidth = USER
useramulatortrace = False
EnableBankModel = True
EnableDynamic = True
BankConflictPenalty = 4
EnableCapacityPenalty = False
DRAMPenaltyScale = 2

# Prefetch experiment knobs
EnablePrefetch = True
PrefetchWindow = 1
PrefetchTarget = ifmap,filter
PrefetchPolicy = next_layer
PrefetchPriority = low
